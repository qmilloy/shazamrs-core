[package]
name = "shazamrs-core"
version = "1.1.2"
edition = "2021"
rust-version = "1.62"

[lib]
name = "shazamrs_core"
crate-type = ["lib"]


[dependencies]
tokio = { version = "1.43.0" }
tempfile = "3.16.0"
rodio = { version = "0.20.1" }
serde_json = "1.0.138"
blocking = { version = "1.5.1", features = [] }
byteorder = "1.5.0"
crc32fast = "1.4.2"
base64 = { version = "0.22.1", features = [] }
chfft = { version = "0.3.4" }
futures = { version = "0.3.31", features = [] }
serde = { version = "1.0.217", features = ["derive"] }
bytes = "1.10.0"
log = "0.4.20"
thiserror = "1.0"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
